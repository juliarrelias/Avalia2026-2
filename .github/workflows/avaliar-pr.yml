name: Avaliador Automático de Projetos 2026

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

jobs:
  identificar-aceitar-e-avaliar:
    name: Identificar Aluno, Aceitar PR e Avaliar com IA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório oficial (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout dos arquivos do Pull Request em área isolada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          path: pr-code
          allow-unsafe-pr-checkout: true

      - name: Carregar subpasta do estudante
        run: |
          cp -r pr-code/T26-* ./ 2>/dev/null || true
          cp -r pr-code/P26-* ./ 2>/dev/null || true
          rm -rf pr-code

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Executar Pipeline (1. Identificar e Merge -> 2. Avaliar e Atribuir Nota)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJETOS_VALIDATION_TOKEN: ${{ secrets.PROJETOS_VALIDATION_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          PROJETOS_API_BASE: ${{ vars.PROJETOS_API_BASE || 'https://frank-active-reader.frank-alcantara.workers.dev' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HTML_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_REPO_URL: ${{ github.event.pull_request.head.repo.html_url }}
        run: node .github/scripts/avaliar-pr.mjs
